services:
  # Where students work: Python + VS Code.
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database's network, so MySQL is reachable at 127.0.0.1:3306.
    network_mode: service:db

  # The MySQL server.
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: Registration
      MYSQL_USER: student
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
      # Every .sql file in /sql runs automatically the first time MySQL starts.
      - ../sql:/docker-entrypoint-initdb.d

volumes:
  mysql-data:
